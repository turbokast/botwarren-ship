version: 2
updates:
  # Workflow actions are pinned to full commit SHAs; Dependabot keeps the SHAs (and the version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5

  # The agent's own dependencies are few and pinned exactly; review every bump.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
