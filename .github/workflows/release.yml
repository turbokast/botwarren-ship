name: Release

# Publishes a release when a `v*` tag is pushed. See docs/RELEASING.md for the full procedure and the one-time setup.
#
#   build      no secrets, read-only token: typecheck, tests, then the per-OS archives, install scripts and SHA256SUMS.
#   reproduce  no secrets: a second, independent build; its SHA256SUMS must equal the first one.
#   publish    runs in the PROTECTED `release` environment (required reviewer): nothing is attested, uploaded or released until a
#              reviewer approves. The R2 credentials exist only as secrets of that environment. It attests the artifacts
#              (GitHub artifact attestations), uploads them to Cloudflare R2 and creates the GitHub Release with the same files.
#   sign-windows, notarize-macos   DISABLED stubs (`if: false`): see the notes on each job. They are not part of any release yet.
#
# NO update manifest is built or signed here. Until a production release key exists (docs/RELEASING.md) releases ship WITHOUT a
# manifest, so the agent's updater and the one-line installers stay inert. The dev key is never used in CI.
#
# Every action is pinned to a full commit SHA (the tag is in the trailing comment). Update them through Dependabot.
#
# Secrets (all stored ONLY in the `release` environment, never as repository secrets):
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   an R2 API token scoped to the bucket `botwarren-downloads` (object read and write)
#   R2_ENDPOINT                              https://<cloudflare-account-id>.r2.cloudflarestorage.com
# Secrets for the disabled signing stubs are listed on those jobs.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  R2_BUCKET: botwarren-downloads
  NODE_VERSION: '24'

jobs:
  build:
    name: build archives
    if: github.repository == 'turbokast/botwarren-ship'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag matches package.json and is on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"; exit 1
          fi
          grep -q "VERSION = '${version}'" src/version.ts || { echo "::error::src/version.ts is not ${version}"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "::error::tag ${TAG} is not on main"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the per-OS archives (no manifest)
        # The Node.js runtimes are downloaded from nodejs.org and must match both its SHASUMS256.txt and the hashes pinned in
        # packaging/node-pins.json. OS signing stages skip themselves (no credentials, wrong host): see the disabled jobs below.
        run: node scripts/build-release.mjs --no-manifest --out dist/release

      - name: List what will be released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "dist/release/${VERSION}"
          ls -l
          { echo '### SHA256SUMS'; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/release/${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 7

  reproduce:
    name: independent rebuild
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild
        run: node scripts/build-release.mjs --no-manifest --out dist/rebuild

      - name: Download the first build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: first

      - name: Compare
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if ! diff -u "first/SHA256SUMS" "dist/rebuild/${VERSION}/SHA256SUMS"; then
            echo "::error::the two builds differ: the release is not reproducible, refusing to publish"; exit 1
          fi
          echo "the independent rebuild produced identical hashes"

  publish:
    name: attest, upload and release
    needs: [build, reproduce]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The protected environment: required reviewer, restricted to v* tags. Holds R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT.
    environment:
      name: release
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # keyless signing of the attestations (Sigstore)
      attestations: write    # store the attestations
    steps:
      - name: Download the build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Verify the downloaded files against SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          ls -l

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload to Cloudflare R2 (archives first, then the checksums, the installers last)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          VERSION: ${{ needs.build.outputs.version }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is not set in the release environment}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is not set in the release environment}"
          : "${R2_ENDPOINT:?R2_ENDPOINT is not set in the release environment}"
          put() { aws s3 cp "$1" "s3://${R2_BUCKET}/$2" --endpoint-url "${R2_ENDPOINT}" --cache-control "$3" --only-show-errors; }
          cd dist
          for f in botwarren-"${VERSION}"-*; do put "$f" "$f" "public, max-age=31536000, immutable"; done
          put SHA256SUMS "SHA256SUMS-${VERSION}" "public, max-age=31536000, immutable"
          put SHA256SUMS "SHA256SUMS" "public, max-age=300"
          put install.sh "install.sh" "public, max-age=300"
          put install.ps1 "install.ps1" "public, max-age=300"
          echo "uploaded ${VERSION} to ${R2_BUCKET}"

      - name: Create the GitHub Release with the same files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${ATTESTATION_BUNDLE}" "dist/attestations-${VERSION}.sigstore.jsonl"
          flags=(--verify-tag --generate-notes --title "Botwarren ship agent ${VERSION}")
          case "${VERSION}" in 0.*) flags+=(--prerelease) ;; esac
          gh release create "${TAG}" dist/* "${flags[@]}" --repo "${GITHUB_REPOSITORY}"

  # ------------------------------------------------------------------------------------------------------------------------
  # DISABLED STUB: Windows code signing with SignPath (free for open source: https://signpath.org/ , certificate by SignPath
  # Foundation). Enable only after the SignPath Foundation has accepted the project and the signing policy is configured there.
  # NOT TESTED, NOT PART OF A RELEASE. Before enabling, the signed files must be fed back into the archive build (the archives
  # must be built from the signed install.ps1 and uninstall.ps1, and hashed AFTER signing): build-release.mjs has no
  # "use these signed files" option yet, so that wiring is a follow-up.
  #
  # Needs, in a protected environment `release-signing-windows` (required reviewer):
  #   secret    SIGNPATH_API_TOKEN
  #   variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG, SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
  # SignPath requires the unsigned files to be uploaded as a GitHub artifact by this very workflow run.
  sign-windows:
    name: sign Windows files (SignPath) [DISABLED]
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release-signing-windows
    permissions:
      contents: read
      actions: read          # SignPath reads the uploaded artifact
      id-token: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload the unsigned Windows scripts
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows
          path: |
            packaging/install.ps1
            packaging/uninstall.ps1
          if-no-files-found: error

      - name: Submit the signing request (an approver must approve it in SignPath)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Keep the signed files for the archive build (follow-up wiring)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows
          path: signed/
          if-no-files-found: error

  # ------------------------------------------------------------------------------------------------------------------------
  # DISABLED STUB: macOS code signing and Apple notarisation (Developer ID Application certificate; needs the Apple Developer
  # Program membership of TurboKast Ltd). NOT TESTED, NOT PART OF A RELEASE. scripts/lib/signing.mjs does the signing and the
  # notarisation (`xcrun notarytool`) when it runs on macOS with these variables and `--require-signing`. The mac archives it
  # builds here would have to replace the ones from the Linux build job (and be hashed after signing); that merge is a follow-up.
  #
  # Needs, in a protected environment `release-signing-macos` (required reviewer), all as SECRETS:
  #   APPLE_CERTIFICATE_P12_BASE64     the Developer ID Application certificate and key, base64 of the .p12
  #   APPLE_CERTIFICATE_PASSWORD       the .p12 password
  #   APPLE_SIGNING_IDENTITY           e.g. "Developer ID Application: TurboKast Ltd (TEAMID)"
  #   APPLE_NOTARY_KEY_P8_BASE64       App Store Connect API key (.p8), base64
  #   APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER   the key id and the issuer id of that API key
  notarize-macos:
    name: sign and notarise macOS archives [DISABLED]
    if: ${{ false }}
    needs: build
    runs-on: macos-latest
    environment:
      name: release-signing-macos
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import the signing certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          password="$(uuidgen)"
          echo "${APPLE_CERTIFICATE_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${RUNNER_TEMP}/cert.p12" -k "${keychain}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}"
          security list-keychains -d user -s "${keychain}" login.keychain
          rm -f "${RUNNER_TEMP}/cert.p12"

      - name: Build, sign and notarise the macOS archives
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          echo "${APPLE_NOTARY_KEY_P8_BASE64}" | base64 --decode > "${RUNNER_TEMP}/notary.p8"
          export APPLE_NOTARY_KEY_PATH="${RUNNER_TEMP}/notary.p8"
          node scripts/build-release.mjs --targets mac-arm64,mac-x64 --no-manifest --require-signing --out dist/macos
          rm -f "${RUNNER_TEMP}/notary.p8"

      - name: Keep the signed macOS archives (follow-up wiring)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos
          path: dist/macos/
          if-no-files-found: error
