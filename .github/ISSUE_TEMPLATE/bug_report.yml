name: Bug report
description: Something does not work as described
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste secrets, tokens, prompts, code, file contents or private paths.** Redact them.
        If this is a security or privacy problem (the agent read, logged or sent something it should not), do not file it here: email support@turbokast.com (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Agent version
      description: Output of `botwarren --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How was it installed?
      description: Installer script, manual archive, built from source, Homebrew, Scoop
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `botwarren status` or the agent log. The log contains error codes, not content, but check it before pasting.
      render: text
